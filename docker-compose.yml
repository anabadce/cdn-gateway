
name: cdn-gateway

services:
  nginx:
    container_name: nginx
    build: nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ${LETSENCRYPT_DATA}:/etc/letsencrypt:ro
    restart: always
    networks:
      - shared-network

  certbot:
    image: certbot/certbot
    container_name: certbot
    restart: unless-stopped
    volumes:
      - ${LETSENCRYPT_DATA}:/etc/letsencrypt
    entrypoint: /bin/sh
    command: >
      -c "trap exit TERM;
          while :; do
            certbot renew --quiet;
            sleep 12h & wait $${!};
          done"

networks:
  shared-network:
    external: true
